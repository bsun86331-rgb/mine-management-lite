<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d31"><title>宿舍管理看板</title><link rel="stylesheet" href="dormitory.css?v=20261022-1"><script src="logistics-store.js?v=20261016-7" defer></script><script src="dormitory-store.js?v=20261022-1" defer></script><script src="dormitory-page.js?v=20261022-1" defer></script></head><body><main><header><div><small>矿山管理系统 · 生活后勤</small><h1>宿舍管理看板</h1><p id="who">请从本人工作主页进入</p></div><button id="settings" hidden>宿舍设置</button></header><p id="error" role="alert"></p><div id="content" hidden><section class="metrics" id="metrics"></section><section class="toolbar"><form id="query"><label for="search">查找司机 / 宿舍</label><div><input id="search" type="search" placeholder="姓名、员工编号或宿舍编号" maxlength="80"><button class="primary">查询</button><button type="button" id="reset">重置</button></div></form><p id="myRoom"></p></section><p id="hint"></p><section id="results" class="results" aria-live="polite"></section><section id="rooms" class="rooms" aria-label="宿舍列表"></section></div><footer><button id="back">返回工作主页</button><span>数据保存在当前浏览器；不同手机暂不共享。</span></footer></main><dialog id="editor"><form id="roomForm"><h2 id="editTitle">新增宿舍</h2><label for="number">宿舍编号</label><input id="number" maxlength="40" required placeholder="例如：1栋 101"><label for="capacity">容纳人数</label><input id="capacity" type="number" min="1" max="100" step="1" required><p id="formError" role="alert"></p><div class="actions"><button type="button" id="deleteRoom" class="danger" hidden>删除空宿舍</button><button type="button" id="cancel">取消</button><button class="primary" id="save">保存设置</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
