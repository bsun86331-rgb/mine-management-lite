<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用车检查</title><link rel="stylesheet" href="transport.css?v=20261021-32"><link rel="stylesheet" href="vehicle-check.css?v=20261022-10"><script src="logistics-store.js?v=20261016-7" defer></script><script src="attachment-storage.js?v=20261016-1" defer></script><script src="service-care.js?v=20261021-12" defer></script><script src="transport-store.js?v=20261024-6" defer></script><script src="vehicle-check.js?v=20261024-6" defer></script></head><body><main class="vehicle-check-page"><header class="page-head"><div><small>VEHICLE INSPECTION</small><h1>用车检查</h1><p id="identity"></p></div><button class="soft" id="back" type="button">返回工作主页</button></header><p id="error" role="alert"></p><div id="workspace" hidden><section class="panel"><h2>选择本次用车</h2><label>皮卡 / 指挥车<select id="vehicle"><option value="">请选择皮卡 / 指挥车</option></select></label><p id="vehicleHint" class="muted">仅限皮卡、指挥车；生产运输车辆及设备不在此选择。</p></section><section class="panel" id="inspection" hidden><h2>使用前检查</h2><p id="previous" class="muted"></p><section class="meter-inspection-fields"><h3>仪表读数与照片</h3><label id="meterLabel" for="meterValue">当前公里（必填）</label><input id="meterValue" type="number" min="0" step="0.1" required><label>仪表照片（必填，单张不超过10MB）<input id="meterPhoto" type="file" accept="image/*" capture="environment" required></label><div id="meterPreview" class="photos"></div></section><div class="actions inspection-actions"><button id="abnormal" type="button" class="amber">拍照上报异常</button><button id="normal" type="button">检查无异常，开始用车</button></div><p class="help">异常上报不自动暂停车辆；正常检查直接登记，不再弹出确认窗口。</p></section><section class="panel"><h2>我的用车检查记录</h2><div id="history"></div></section></div></main><dialog id="abnormalDialog"><form id="abnormalForm"><header class="modal-head"><h2>用车检查异常</h2><button type="button" class="soft" id="close">关闭</button></header><p id="meterSummary" class="help"></p><label>异常归属<select id="fault"></select></label><label>异常照片（可多张，单张不超过10MB）<input id="faultPhotos" type="file" accept="image/*" capture="environment" multiple></label><div id="faultPreview" class="photos"></div><label>异常说明（选填）<textarea id="note" rows="3" maxlength="300"></textarea></label><p id="modalError" role="alert"></p><div class="modal-actions"><button type="button" class="soft" id="cancel">取消</button><button id="report" type="submit">上报异常</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
