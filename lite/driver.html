<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a24">
  <title>司机端 · 矿山简版</title>
  <style>
    :root{color-scheme:light;--ink:#15231e;--muted:#69776f;--line:#e4e9e5;--paper:#f4f6f2;--white:#fff;--green:#176b4a;--green-dark:#102a24;--lime:#d7f36a;--orange:#d97706;--red:#b93832;--shadow:0 12px 32px rgba(21,35,30,.07)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .shell{max-width:1040px;margin:auto;min-height:100vh;padding-bottom:90px}
    .top{padding:22px 26px 18px;background:var(--green-dark);color:white}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
    .brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--lime);color:var(--green-dark);font-weight:900}
    .role-tag{padding:6px 10px;border:1px solid #ffffff35;border-radius:999px;color:#e9f1e9;font-size:12px}
    .welcome{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:23px}
    .welcome h1{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.2;letter-spacing:-.04em}
    .welcome p{margin:7px 0 0;color:#c0cdc5;font-size:13px}
    .date{color:#c0cdc5;font-size:12px;text-align:right}
    main{padding:22px 26px}
    .notice{margin-bottom:16px;padding:10px 13px;border:1px solid #e9d9a7;border-radius:12px;background:#fff9e9;color:#725a1f;font-size:12px}
    .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.85fr);gap:16px;align-items:start}
    .stack{display:grid;gap:16px}
    .card{border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:var(--shadow)}
    .card-pad{padding:19px}
    .card-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}
    .eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    h2{margin:3px 0 0;font-size:18px;letter-spacing:-.02em}
    .state{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#eef2ef;color:#44534b;font-size:12px;font-weight:700;white-space:nowrap}
    .dot{width:7px;height:7px;border-radius:50%;background:#89958d}
    .state.live{background:#e5f5eb;color:#176b4a}.state.live .dot{background:#2a9d62}
    .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px;border-radius:14px;background:#f3f7f3}
    .route-point:last-child{text-align:right}
    .route-label{display:block;color:var(--muted);font-size:11px}
    .route strong{display:block;margin-top:3px;font-size:17px}
    .arrow{color:#98a69c;font-size:20px}
    .task-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .meta{padding:11px 12px;border:1px solid var(--line);border-radius:12px}
    .meta span{display:block;color:var(--muted);font-size:11px}
    .meta strong{display:block;margin-top:3px;font-size:14px}
    .task-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
    .btn{min-height:46px;padding:11px 14px;border:0;border-radius:12px;font-weight:750;transition:transform .15s,filter .15s}
    .btn:hover{filter:brightness(.97);transform:translateY(-1px)}
    .btn:focus-visible{outline:3px solid #8cbfa7;outline-offset:2px}
    .btn-primary{background:var(--green);color:white}
    .btn-dark{background:var(--green-dark);color:white}
    .btn-soft{border:1px solid var(--line);background:white;color:var(--ink)}
    .btn-danger{border:1px solid #f1d5d2;background:#fff7f6;color:var(--red)}
    .btn:disabled{cursor:not-allowed;opacity:.48;transform:none}
    .trip-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:14px;background:var(--green-dark);color:white}
    .trip-number{font-size:42px;font-weight:850;letter-spacing:-.06em;line-height:1}
    .trip-copy{color:#c0cdc5;font-size:12px}
    .trip-button{min-width:126px;background:var(--lime);color:var(--green-dark)}
    .trip-button:disabled{background:#85928a;color:#e5e9e5}
    .checklist{display:grid;gap:10px}
    .check-row{display:flex;align-items:center;gap:10px;color:#35453c;font-size:13px}
    .check-row input{width:18px;height:18px;accent-color:var(--green)}
    .check-summary{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    .gps-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .gps-status{display:flex;align-items:center;gap:9px}
    .gps-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#edf5ef;color:var(--green);font-size:18px}
    .gps-title{font-weight:750}
    .gps-detail{color:var(--muted);font-size:11px}
    .gps-btn{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:12px;font-weight:700}
    .records{display:grid;gap:10px}
    .record{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
    .record:last-child{padding-bottom:0;border-bottom:0}
    .record-title{font-size:13px;font-weight:700}
    .record-sub{margin-top:3px;color:var(--muted);font-size:11px}
    .record-time{color:var(--muted);font-size:11px;white-space:nowrap}
    .empty{padding:18px 10px;color:var(--muted);text-align:center;font-size:13px}
    .toast{position:fixed;z-index:10;left:50%;bottom:95px;transform:translate(-50%,16px);padding:11px 16px;border-radius:12px;background:#17251e;color:white;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{transform:translate(-50%,0);opacity:1}
    .nav{position:fixed;z-index:5;right:0;bottom:0;left:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(16px)}
    .nav-inner{display:grid;grid-template-columns:repeat(3,1fr);width:min(480px,100%);gap:5px}
    .nav button{padding:7px;border:0;border-radius:11px;background:transparent;color:#758078;font-size:11px;font-weight:700}
    .nav button span{display:block;font-size:17px;line-height:1.3}
    .nav button.active{background:#edf5ef;color:var(--green)}
    .modal-backdrop{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#14221cb8}
    .modal-backdrop.open{display:flex}
    .modal{width:min(440px,100%);padding:22px;border-radius:18px;background:white;box-shadow:0 20px 60px #0003}
    .modal h2{margin:0 0 6px}
    .modal p{margin:0 0 16px;color:var(--muted);font-size:13px}
    textarea{width:100%;min-height:115px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:12px}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
    .section[hidden]{display:none}
    @media(max-width:700px){
      .top{padding:17px 16px}.welcome{margin-top:19px}main{padding:15px 14px}.grid{grid-template-columns:1fr;gap:13px}.stack{gap:13px}.card-pad{padding:16px}.task-meta{gap:7px}.meta{padding:9px}.meta strong{font-size:13px}.trip-hero{align-items:start;flex-direction:column}.trip-button{width:100%}.route strong{font-size:15px}.date{font-size:11px}
    }
    @media(min-width:701px){.trip-hero{min-height:148px;flex-direction:column;align-items:start}.trip-button{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="topline">
        <div class="brand"><span class="brand-mark">M</span><span>矿山简版</span></div>
        <span class="role-tag">司机端</span>
      </div>
      <div class="welcome">
        <div><h1>早上好，李师傅</h1><p>今天的任务和车辆状态都在这里</p></div>
        <div class="date" id="todayLabel"></div>
      </div>
    </header>

    <main>
      <div class="notice">演示版：操作记录保存在当前浏览器，尚未连接生产系统。</div>
      <section class="section" id="workSection">
        <div class="grid">
          <div class="stack">
            <article class="card card-pad">
              <div class="card-head">
                <div><div class="eyebrow">当班任务 · 白班</div><h2>北采区运输</h2></div>
                <span class="state" id="workState"><i class="dot"></i><span>等待作业</span></span>
              </div>
              <div class="route">
                <div class="route-point"><span class="route-label">装载点</span><strong>北采区 A2</strong></div>
                <span class="arrow">→</span>
                <div class="route-point"><span class="route-label">卸载点</span><strong>破碎站 1</strong></div>
              </div>
              <div class="task-meta">
                <div class="meta"><span>车辆</span><strong>矿卡 08</strong></div>
                <div class="meta"><span>挖机</span><strong>挖机 03</strong></div>
                <div class="meta"><span>物料</span><strong>矿石</strong></div>
              </div>
              <div class="task-actions">
                <button class="btn btn-soft" id="inspectionOpen">出车检查</button>
                <button class="btn btn-primary" id="workToggle">开始作业</button>
              </div>
            </article>

            <article class="card card-pad">
              <div class="card-head"><div><div class="eyebrow">今日进度</div><h2>运输趟次</h2></div><span class="state live"><i class="dot"></i><span>当班统计</span></span></div>
              <div class="trip-hero">
                <div><div class="trip-number" id="tripCount">0</div><div class="trip-copy">已完成趟次</div></div>
                <button class="btn trip-button" id="completeTrip" disabled>完成一趟</button>
              </div>
            </article>
          </div>

          <div class="stack">
            <article class="card card-pad">
              <div class="card-head"><div><div class="eyebrow">安全出车</div><h2>车辆检查</h2></div><button class="gps-btn" id="inspectionEdit">检查</button></div>
              <div class="checklist">
                <label class="check-row"><input type="checkbox" data-check="brakes"> 制动和转向正常</label>
                <label class="check-row"><input type="checkbox" data-check="tires"> 轮胎和车身正常</label>
                <label class="check-row"><input type="checkbox" data-check="lights"> 灯光和喇叭正常</label>
              </div>
              <div class="check-summary" id="checkSummary">完成车辆检查后即可开始作业。</div>
            </article>

            <article class="card card-pad">
              <div class="gps-line">
                <div class="gps-status"><span class="gps-icon">⌖</span><div><div class="gps-title">当前位置</div><div class="gps-detail" id="gpsDetail">尚未获取定位</div></div></div>
                <button class="gps-btn" id="gpsButton">更新定位</button>
              </div>
            </article>

            <article class="card card-pad">
              <div class="card-head"><div><div class="eyebrow">需要协助</div><h2>车辆异常</h2></div></div>
              <button class="btn btn-danger" id="reportFault" style="width:100%">报告故障</button>
            </article>
          </div>
        </div>
      </section>

      <section class="section" id="recordsSection" hidden>
        <article class="card card-pad">
          <div class="card-head"><div><div class="eyebrow">本机记录</div><h2>作业动态</h2></div><button class="gps-btn" id="clearRecords">清空演示记录</button></div>
          <div class="records" id="recordList"></div>
        </article>
      </section>

      <section class="section" id="profileSection" hidden>
        <article class="card card-pad">
          <div class="card-head"><div><div class="eyebrow">我的账号</div><h2>李师傅</h2></div><span class="role-tag" style="color:#176b4a;border-color:#dce8df">司机</span></div>
          <div class="task-meta">
            <div class="meta"><span>所属班组</span><strong>运输一组</strong></div>
            <div class="meta"><span>当前车辆</span><strong>矿卡 08</strong></div>
            <div class="meta"><span>当班类型</span><strong>白班</strong></div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <nav class="nav" aria-label="底部导航">
    <div class="nav-inner">
      <button class="active" data-page="workSection"><span>⌂</span>作业</button>
      <button data-page="recordsSection"><span>▤</span>记录</button>
      <button data-page="profileSection"><span>○</span>我的</button>
    </div>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="faultModal" role="dialog" aria-modal="true" aria-labelledby="faultTitle">
    <div class="modal">
      <h2 id="faultTitle">报告车辆故障</h2>
      <p>简单描述问题，方便调度和维修人员处理。</p>
      <textarea id="faultText" placeholder="例如：右后轮胎漏气"></textarea>
      <div class="modal-actions"><button class="btn btn-soft" id="cancelFault">取消</button><button class="btn btn-primary" id="submitFault">提交报告</button></div>
    </div>
  </div>

  <script>
    (() => {
      const KEY = "mine-lite-driver-demo-v1";
      const defaults = { working: false, trips: 0, checks: { brakes: false, tires: false, lights: false }, records: [] };
      let state;
      try { state = { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; }
      catch { state = { ...defaults }; }
      state.checks = { ...defaults.checks, ...(state.checks || {}) };
      state.records = Array.isArray(state.records) ? state.records : [];

      const $ = (id) => document.getElementById(id);
      const checkboxes = [...document.querySelectorAll("[data-check]")];
      const save = () => localStorage.setItem(KEY, JSON.stringify(state));
      const stamp = () => new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date());
      const addRecord = (title, detail) => {
        state.records.unshift({ title, detail, time: stamp() });
        state.records = state.records.slice(0, 30);
        save();
        render();
      };
      const toast = (message) => {
        $("toast").textContent = message;
        $("toast").classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => $("toast").classList.remove("show"), 2200);
      };
      const allChecked = () => Object.values(state.checks).every(Boolean);

      function render() {
        $("tripCount").textContent = state.trips;
        $("workState").classList.toggle("live", state.working);
        $("workState").querySelector("span").textContent = state.working ? "作业中" : "等待作业";
        $("workToggle").textContent = state.working ? "结束作业" : "开始作业";
        $("workToggle").className = state.working ? "btn btn-dark" : "btn btn-primary";
        $("completeTrip").disabled = !state.working;
        checkboxes.forEach((box) => { box.checked = Boolean(state.checks[box.dataset.check]); });
        $("checkSummary").textContent = allChecked() ? "车辆检查已完成，可以开始作业。" : "完成车辆检查后即可开始作业。";
        const list = $("recordList");
        list.innerHTML = state.records.length
          ? state.records.map((item) => '<div class="record"><div><div class="record-title">' + escapeHtml(item.title) + '</div><div class="record-sub">' + escapeHtml(item.detail) + '</div></div><div class="record-time">' + escapeHtml(item.time) + '</div></div>').join("")
          : '<div class="empty">还没有作业记录</div>';
        save();
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }

      const today = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(new Date());
      $("todayLabel").textContent = today + " · 白班";

      $("workToggle").addEventListener("click", () => {
        if (!state.working && !allChecked()) {
          toast("请先完成车辆检查");
          $("inspectionOpen").focus();
          return;
        }
        state.working = !state.working;
        addRecord(state.working ? "开始作业" : "结束作业", state.working ? "北采区运输 · 矿卡 08" : "本次作业已结束");
        toast(state.working ? "已开始作业" : "已结束作业");
      });
      $("completeTrip").addEventListener("click", () => {
        if (!state.working) return;
        state.trips += 1;
        addRecord("完成一趟", "北采区 A2 → 破碎站 1 · 矿石");
        toast("已记录一趟运输");
      });
      checkboxes.forEach((box) => box.addEventListener("change", () => {
        state.checks[box.dataset.check] = box.checked;
        save();
        render();
      }));
      const focusInspection = () => {
        checkboxes[0].focus();
        toast("请逐项确认车辆状态");
      };
      $("inspectionOpen").addEventListener("click", focusInspection);
      $("inspectionEdit").addEventListener("click", focusInspection);

      $("gpsButton").addEventListener("click", () => {
        const detail = $("gpsDetail");
        if (!navigator.geolocation) { detail.textContent = "设备不支持定位"; return; }
        detail.textContent = "正在获取位置…";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            detail.textContent = pos.coords.latitude.toFixed(5) + ", " + pos.coords.longitude.toFixed(5) + " · ±" + Math.round(pos.coords.accuracy) + "m";
            addRecord("更新定位", "定位已获取");
            toast("定位已更新");
          },
          () => { detail.textContent = "定位失败，请检查设备权限"; toast("无法获取定位"); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      });

      const modal = $("faultModal");
      $("reportFault").addEventListener("click", () => { modal.classList.add("open"); $("faultText").focus(); });
      $("cancelFault").addEventListener("click", () => modal.classList.remove("open"));
      modal.addEventListener("click", (event) => { if (event.target === modal) modal.classList.remove("open"); });
      $("submitFault").addEventListener("click", () => {
        const message = $("faultText").value.trim();
        if (!message) { toast("请填写故障情况"); $("faultText").focus(); return; }
        addRecord("车辆故障已上报", message);
        $("faultText").value = "";
        modal.classList.remove("open");
        toast("故障报告已保存");
      });

      $("clearRecords").addEventListener("click", () => {
        state.records = [];
        state.trips = 0;
        save();
        render();
        toast("演示记录已清空");
      });
      document.querySelectorAll("[data-page]").forEach((button) => button.addEventListener("click", () => {
        document.querySelectorAll("[data-page]").forEach((item) => item.classList.toggle("active", item === button));
        document.querySelectorAll("main > .section").forEach((section) => { section.hidden = section.id !== button.dataset.page; });
      }));
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") modal.classList.remove("open"); });
      render();
    })();
  </script>
</body>
</html>
