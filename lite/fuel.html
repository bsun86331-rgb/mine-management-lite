<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加油登记</title><link rel="stylesheet" href="leave.css?v=20261019-7"><script src="logistics-store.js?v=20261016-7" defer></script><script src="service-care.js?v=20261021-12" defer></script><script src="transport-store.js?v=20261024-6" defer></script><script src="task-engine.js?v=20261022-8" defer></script><script src="fuel-store.js?v=20261025-3" defer></script><script src="fuel-ui.js?v=20261025-3" defer></script></head><body><main id="app" hidden><header class="page-head"><div><small>FUEL RECORD</small><h1>加油登记</h1><p id="identity"></p></div><button id="back" type="button" class="soft">返回工作主页</button></header><p id="notice" role="status"></p><section class="panel"><h2>本次加油</h2><p id="mode"></p><form id="form"><label>加油车辆<select id="vehicle" required></select></label><p id="task"></p><label>油品<select id="fuelType" required><option value="">请选择油品</option><option>柴油</option><option>汽油</option></select></label><label>加油量（升，必填）<input id="litres" type="number" min="0.01" max="100000" step="0.01" required></label><label>备注（选填）<textarea id="note" rows="3" maxlength="300"></textarea></label><p class="help">保存时自动记录加油时间；请核对实际加油车辆和数量。</p><button id="save" type="submit">保存加油记录</button></form></section><section class="panel"><h2>我的加油记录</h2><div id="history"></div></section><footer>当前加油记录保存在本浏览器，不同手机暂不共享。</footer></main><section class="panel" id="blocked" hidden><h1>暂时无法进入</h1><p id="error"></p><a href="index.html">返回首页</a></section></body></html>
