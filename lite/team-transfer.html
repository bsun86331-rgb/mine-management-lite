<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请换组</title><link rel="stylesheet" href="leave.css?v=20261019-7"><script src="logistics-store.js?v=20261016-7" defer></script><script src="team-transfer-store.js?v=20261024-7" defer></script><script src="team-transfer-ui.js?v=20261024-7" defer></script></head><body><main id="app" hidden><header class="page-head"><div><small>TEAM TRANSFER</small><h1>申请换组</h1><p id="identity"></p></div><button id="back" type="button" class="soft">返回工作主页</button></header><p id="notice" role="status"></p><section class="panel"><h2>换组申请</h2><p>由当前班组车队长审批，同意后立即更新所属班组。已发布任务和历史记录保留原班组。</p><form id="apply"><label>申请转入班组<select id="target"></select></label><label>本组车队长<select id="approver" required></select></label><label>换组说明（选填）<textarea id="reason" rows="3" maxlength="300"></textarea></label><p id="hint"></p><button id="submit" type="submit">提交换组申请</button></form></section><section class="panel" id="approvalPanel" hidden><h2>待我审批</h2><div id="approvals"></div></section><section class="panel"><h2>我的换组申请</h2><div id="mine"></div></section><footer>当前信息保存在同一浏览器；入口显示待审批与未读结果，不是跨手机或离线推送。</footer></main><section id="blocked" class="panel" hidden><h1>暂时无法进入</h1><p id="error"></p><a href="index.html">返回首页</a></section><dialog id="decision"><h2 id="decisionTitle"></h2><p id="decisionInfo"></p><label>审批说明（选填）<textarea id="decisionNote" rows="3" maxlength="300"></textarea></label><p id="decisionError" role="alert"></p><div class="dialog-actions"><button id="confirm" type="button">确认</button><button id="cancel" type="button" class="soft">取消</button></div></dialog></body></html>
