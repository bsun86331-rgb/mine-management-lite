<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d31">
<title>Boss 端 · 矿山简版</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6f2;color:#17251e;font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(480px,100%);padding:30px;border:1px solid #e2e9e3;border-radius:20px;background:#fff;box-shadow:0 18px 50px #173d3112}.brand{color:#176b4a;font-size:12px;font-weight:800;letter-spacing:.1em}.card h1{margin:15px 0 5px;font-size:27px}.lead,.note{color:#738078;font-size:13px}.note{margin:18px 0;padding:12px;border-radius:11px;background:#f5f8f4;font-size:12px}.warning{margin:14px 0;padding:11px;border:1px solid #f0d49e;border-radius:10px;background:#fff8e9;color:#80520b;font-size:11px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:750}.field input{width:100%;height:44px;padding:10px;border:1px solid #dce5dd;border-radius:9px;font:inherit}.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:10px;background:#176b4a;color:#fff;font:inherit;font-weight:800;cursor:pointer}.error{min-height:20px;color:#b93832;font-size:12px}.home{display:inline-block;margin-top:15px;color:#53675a;font-size:12px}.work[hidden],.gate[hidden]{display:none}.work{padding-top:12px}.work-panel{margin:16px 0;padding:17px;border:1px solid #e2e9e3;border-radius:13px;background:#fafcf9}.work-panel h2{margin:0;font-size:17px}.work-panel p{margin-bottom:0;color:#738078;font-size:13px}
</style>
<link rel="stylesheet" href="workspace-shortcuts.css?v=20261021-29"></head>
<body>
<main class="card">
  <div class="brand">矿山管理系统简版 · BOSS</div>
  <section class="gate" id="bossGate">
    <h1 id="gateTitle">Boss 端密码入口</h1>
    <p class="lead" id="gateDesc">首次由 Boss 本人在当前浏览器设置密码，之后使用该密码进入。</p>
    <div class="warning">Boss 密码独立于管理员后台密码。此密码只保存在当前浏览器，不是正式账号认证；请勿用于保护真实业务数据。</div>
    <form id="bossAuthForm">
      <div class="field"><label for="bossPassword">Boss 密码</label><input id="bossPassword" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="field" id="confirmWrap"><label for="confirmPassword">再次输入密码</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password"></div>
      <div class="error" id="gateError" role="alert" aria-live="polite"></div>
      <button class="btn" id="gateSubmit" type="submit">设置密码并进入</button>
    </form>
  </section>
  <section class="work" id="bossWork" hidden>
    <h1>Boss 工作台</h1>
    <p class="lead">Boss 入口密码验证已通过。</p>
    <div class="work-panel"><h2>经营管理功能待建设</h2><p>后续将在此逐步建设经营概况和关键指标。</p></div>
    <button class="btn" id="lockButton" type="button">退出 Boss 端</button><div class="workspace-shortcuts" data-workspace-shortcuts></div>
  </section>
  <a class="home workspace-home workspace-shortcut" href="index.html">返回系统首页</a>
</main>
<script>
(() => {
  const KEY="mine-management-lite-boss-auth-v1";
  const $=id=>document.getElementById(id);
  const form=$("bossAuthForm"), gate=$("bossGate"), work=$("bossWork"), error=$("gateError");
  function authRecord(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch{return null}}
  function toBase64(bytes){let binary="";bytes.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary)}
  async function passwordHash(password,saltText){
    const salt=Uint8Array.from(atob(saltText),char=>char.charCodeAt(0));
    const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},key,256);
    return toBase64(new Uint8Array(bits));
  }
  function setMode(){
    const setup=!authRecord();
    $("gateTitle").textContent=setup?"首次使用 · 设置 Boss 密码":"Boss 端登录";
    $("gateDesc").textContent=setup?"请由 Boss 本人在当前浏览器设置密码。":"输入当前浏览器设置的 Boss 密码进入工作台。";
    $("confirmWrap").hidden=!setup;
    $("confirmPassword").required=setup;
    $("confirmPassword").autocomplete=setup?"new-password":"off";
    $("gateSubmit").textContent=setup?"设置密码并进入":"验证并进入";
  }
  function unlock(){window.MineLeaveBoss=true;gate.hidden=true;work.hidden=false;}
  function lock(){window.MineLeaveBoss=false;window.MineLeaveEntry?.close();work.hidden=true;gate.hidden=false;form.reset();error.textContent="";setMode();}
  setMode();
  form.addEventListener("submit",async event=>{
    event.preventDefault();error.textContent="";
    const password=$("bossPassword").value, record=authRecord();
    if(password.length<6){error.textContent="密码至少需要 6 位。";return}
    $("gateSubmit").disabled=true;
    try{
      if(!record){
        if(password!==$("confirmPassword").value){error.textContent="两次输入的密码不一致。";return}
        const salt=toBase64(crypto.getRandomValues(new Uint8Array(16)));
        localStorage.setItem(KEY,JSON.stringify({salt,hash:await passwordHash(password,salt)}));
        unlock();
      }else if(await passwordHash(password,record.salt)===record.hash){
        unlock();
      }else{
        error.textContent="密码不正确，请重试。";
      }
    }catch{error.textContent="浏览器暂不支持本地密码验证，请使用最新版浏览器。"}
    finally{$("gateSubmit").disabled=false}
  });
  $("lockButton").addEventListener("click",lock);
})();
</script>
<script src="logistics-store.js?v=20261016-7" defer></script><script src="leave-store.js?v=20261019-6" defer></script><script src="leave-entry.js?v=20261021-29" defer></script><script src="shared-task-entry.js?v=20261021-29" defer></script><script src="haul-report-entry.js?v=20261021-29" defer></script></body>
</html>
