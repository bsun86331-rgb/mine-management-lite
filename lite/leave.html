<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请销假申请与审批</title><link rel="stylesheet" href="leave.css?v=20261018-2"><script src="logistics-store.js?v=20261016-7" defer></script><script src="leave-store.js?v=20261019-1" defer></script><script src="leave-ui.js?v=20261019-1" defer></script></head>
<body><main id="app" hidden><header class="page-head"><div><small>MINE TRANSPORT</small><h1>请销假申请</h1><p id="identity"></p></div><button type="button" class="soft" id="back">返回工作页</button></header><nav class="tabs"><button type="button" id="applyTab" data-view="apply">请假申请</button><button type="button" id="mineTab" data-view="mine">我的申请</button><button type="button" id="approvalTab" data-view="approval" hidden>请销假审批</button></nav><p id="notice" class="notice" role="status" aria-live="polite"></p>
<section id="applyPanel" class="panel"><h2>请假申请</h2><p id="route"></p><div class="info">请假申请按0.5天选择。批准后未销假一直视为请假中，实际时长持续累计至销假生效时间，超过预计结束时间也不自动结束。</div><form id="requestForm"><label>请假类型<select id="type"><option>轮休假</option><option>事假</option><option>病假</option><option>其他</option></select></label><section class="quota-panel"><h3>轮休假额度</h3><div id="quota" class="quota-grid"></div><p id="quotaMessage"></p></section><label>本次申请天数<input id="days" type="text" readonly aria-label="自动计算的请假天数"></label><div class="date-grid"><label>开始日期<input id="startDate" type="date"></label><label>开始时段<select id="startPart"><option value="am">上午</option><option value="pm">下午</option></select></label><label>结束日期<input id="endDate" type="date"></label><label>结束时段<select id="endPart"><option value="am">上午</option><option value="pm" selected>下午</option></select></label></div><label id="approverField">审批人（选填）<select id="approver"></select></label><p id="routeHelp" class="help"></p><label>联系电话（选填）<input id="phone" type="tel" maxlength="50"></label><label>请假原因（选填）<textarea id="reason" rows="3" maxlength="1000" placeholder="填写请假说明"></textarea></label><button type="submit">提交审批</button></form></section>
<section id="minePanel" class="panel" hidden><h2>我的申请</h2><div id="mineList"></div></section><section id="approvalPanel" class="panel" hidden><h2>请销假审批</h2><div id="approvalList"></div></section><footer>申请与审批记录保存在当前浏览器；跨手机或浏览器暂不共享。请销假审批记录独立保存，当前人工考勤表不自动改写。</footer></main>
<section id="blocked" class="panel blocked" hidden><h1>暂时无法进入</h1><p id="blockedMessage"></p><a href="index.html">返回首页</a></section>
<dialog id="details"><div id="detailBody"></div><section id="returnPanel" class="quota-panel" hidden><h3>返岗销假</h3><p>按原审批路线审批，批准并到达返岗时间后恢复排班资格。</p><label>返岗时间<input id="returnAt" type="datetime-local"></label><label>销假说明（选填）<textarea id="returnReason" rows="2" maxlength="1000"></textarea></label><button id="submitReturn" type="button">提交销假申请</button></section><label id="decisionField">审批意见（选填）<textarea id="decisionNote" rows="2" maxlength="1000"></textarea></label><p id="dialogError" role="alert"></p><div class="dialog-actions"><button type="button" id="approve">批准</button><button type="button" id="reject" class="danger">驳回</button><button type="button" id="withdraw" class="soft">撤回申请</button><button type="button" id="withdrawReturn" class="soft" hidden>撤回销假</button><button type="button" id="closeDetails" class="soft">关闭</button></div></dialog></body></html>
