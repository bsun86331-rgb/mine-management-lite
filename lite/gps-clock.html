<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS上下班打卡</title><link rel="stylesheet" href="gps-clock.css?v=20261020-2"><script src="logistics-store.js?v=20261016-7" defer></script><script src="gps-clock-store.js?v=20261022-1" defer></script><script src="gps-clock-ui.js?v=20261022-1" defer></script></head><body><main><header><div><h1>GPS上下班打卡</h1><p id="identity"></p></div><button id="back" type="button">返回工作主页</button></header><p id="error" role="alert"></p><p id="message" role="status"></p><div id="workspace" hidden><section class="panel" id="clockPanel"><h2>今日打卡</h2><p id="clockState"></p><label>打卡位置<select id="clockPoint"></select></label><p class="hint" id="pointHint"></p><div class="actions"><button id="clockIn" type="button">定位并打上班卡</button><button id="clockOut" type="button">定位并打下班卡</button><button id="refresh" type="button" class="soft">刷新</button></div><p class="hint">每天上班、下班各一次。跨午夜的下班卡归到上班当天。点击打卡时获取GPS；打卡记录供核对，考勤仍由调度确认。</p></section><section class="panel" id="pointsPanel" hidden><h2 id="pointTitle">打卡位置</h2><p class="hint" id="pointRule"></p><form id="pointForm"><input type="hidden" id="pointId"><input type="hidden" id="pointVersion"><div class="grid"><label>位置名称<input id="pointName" required maxlength="60"></label><label>适用班组<select id="pointTeam"></select></label><label>纬度<input id="latitude" type="number" step="any" min="-90" max="90" required></label><label>经度<input id="longitude" type="number" step="any" min="-180" max="180" required></label><label>打卡范围（米）<input id="radius" type="number" min="10" max="5000" value="100" required></label><label>备注<input id="pointNote" maxlength="500"></label></div><div class="actions"><button type="button" id="locatePoint" class="soft">使用当前位置</button><button type="submit" id="savePoint">提交位置</button><button type="button" id="cancelPoint" class="soft" hidden>取消编辑</button></div></form><div id="points"></div></section><section class="panel"><h2 id="recordTitle">我的打卡记录</h2><div class="filters"><label>上班日期<input id="recordDate" type="date"></label><label id="personFilter" hidden>姓名或班组<input id="search" placeholder="搜索姓名或班组"></label><button id="filter" type="button" class="soft">查询</button></div><div id="records"></div></section><p class="hint">当前简版数据保存在本浏览器，不同手机暂不共享。请使用已批准的本人工作端口。</p></div></main></body></html>
